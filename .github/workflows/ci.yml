# Integración Continua de Miralibros ETL.
# Alcance actual: lint con ruff y suite de pytest, sin base de datos, sin servicios,
# sin secretos y sin archivo .env (los tests generan sus XLSX sintéticos en tmp_path).
# Este job no aplica migraciones ni toca entornos reales.

name: CI

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

# Privilegios mínimos: el job sólo necesita leer el repositorio.
permissions:
  contents: read

jobs:
  lint-y-tests:
    name: Lint y tests
    runs-on: ubuntu-latest

    steps:
      # 1. Obtener el código de la rama que disparó el workflow.
      - name: Clonar repositorio
        uses: actions/checkout@v4

      # 2. Instalar Python 3.11 con caché de pip ligada a los dos archivos de requisitos.
      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      # 3. Instalar dependencias de runtime y de desarrollo (pytest, ruff).
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      # 4. Verificar estilo, errores y orden de imports (configuración en pyproject.toml).
      #    Sin continue-on-error: un fallo de lint corta el job.
      - name: Ejecutar lint con ruff
        run: ruff check .

      # 5. Ejecutar la suite de pytest (configuración en pyproject.toml).
      #    Sin continue-on-error: un test fallido corta el job.
      #    No se define DATABASE_URL: si un test la requiriera, debe fallar de forma
      #    explícita en lugar de usar credenciales inventadas.
      - name: Ejecutar tests con pytest
        run: pytest
